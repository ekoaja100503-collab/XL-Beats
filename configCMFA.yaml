port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7895
ipv6: false
mode: rule
log-level: silent
allow-lan: true
external-controller: 0.0.0.0:9090
secret: ""
bind-address: "*"
unified-delay: true
profile:
  store-selected: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: redir-host
  listen: 0.0.0.0:7874
  nameserver:
    - 8.8.8.8
    - 1.0.0.1
    - https://dns.google/dns-query
  fallback:
    - 1.1.1.1
    - 8.8.4.4
    - https://cloudflare-dns.com/dns-query
    - 112.215.203.254
  default-nameserver:
    - 8.8.8.8
    - 1.1.1.1
    - 112.215.203.254

proxies:  
- name: AKUN WS
  type: trojan
  server: 104.18.1.196
  port: 443
  password: aca8945f-8ab5-45c9-aef6-1242264e8b90
  udp: true
  sni: id3-vip.xsrver.biz.id
  skip-cert-verify: true
  network: ws
  ws-opts:
    path: /trojan
    headers: 
      host: id3-vip.xsrver.biz.id
- name: AKUN GRPC
  type: trojan
  server: 104.18.1.196
  port: 443
  password: aca8945f-8ab5-45c9-aef6-1242264e8b90
  udp: true
  sni: id3-vip.xsrver.biz.id
  skip-cert-verify: true
  network: grpc
  grpc-opts:
      grpc-service-name: trojan

proxy-groups:
  - name: ID-X
    type: select
    proxies:
     - FALLBACKID
     - DIRECT
     - REJECT
    use:
     - AKUN WS
     - AKUN GRPC

  - name: MIX-X
    type: select
    proxies:
     - FALLBACKMIX
     - DIRECT
     - REJECT
    use:
     - AKUN WS
     - AKUN GRPC

  - name: FALLBACKID
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    use:
     - AKUN WS
     - AKUN GRPC

  - name: FALLBACKMIX
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    use:
     - AKUN WS
     - AKUN GRPC

  - name: IKLAN
    type: select
    proxies:
     - MIX-X
     - REJECT

  - name: GAME
    type: select
    proxies:
     - ID-X
     - DIRECT
     - REJECT


rules:
 - IP-CIDR,198.18.0.1/16,REJECT,no-resolve
 - RULE-SET,Block,IKLAN
 - RULE-SET,Game,GAME
 - RULE-SET,Umum,MIX-X
 - RULE-SET,indo,ID-X
 - RULE-SET,Sosmed,MIX-X
 - RULE-SET,Streaming,MIX-X
 - RULE-SET,Bankid,ID-X
 - RULE-SET,Tiktok,MIX-X
 - RULE-SET,Meta,MIX-X
 - RULE-SET,PortGame,GAME
 - MATCH,MIX-X


rule-providers:
  Game:
    type: file
    behavior: classical
    path: ./game.yaml 
  PortGame:
    type: file
    behavior: classical
    path: ./portgame.yaml
  Umum:
    type: file
    behavior: classical
    path: ./umum.yaml 
  indo:
    type: file
    behavior: classical
    path: ./indo.yaml
  Sosmed:
    type: file
    behavior: classical
    path: ./sosmed.yaml
  Streaming:
    type: file
    behavior: classical
    path: ./streaming.yaml
  Bankid:
    type: file
    behavior: domain
    path: ./bankid.yaml
  Tiktok:
    type: file
    behavior: domain
    path: ./tiktok.yaml
  Meta:
    type: file
    behavior: domain
    path: ./meta.yaml
  Block:
    type: file
    behavior: domain
    path: ./block.yaml  
